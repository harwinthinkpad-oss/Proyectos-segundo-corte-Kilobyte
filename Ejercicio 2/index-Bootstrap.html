<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convención - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <main class="container mt-5">
    <h2>Convención de Cosplay y Cultura Pop (Bootstrap)</h2>
    <button type="button" class="btn btn-primary" id="body_btNuevoAsistente">Nuevo asistente</button>
    <hr />
    <h3>Asistentes registrados</h3>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr><th>Nombre</th><th>Cédula</th><th>Tipo de pase</th><th>Monto pagado</th></tr>
        </thead>
        <tbody id="body_asistentes"></tbody>
      </table>
    </div>
    <div class="alert alert-info">
      <p class="mb-1">Total recaudado en taquilla: <strong id="body_lblTotal">$0</strong></p>
      <p class="mb-0">Promedio pagado por Cosplayers: <strong id="body_lblPromedio">$0</strong></p>
    </div>
  </main>

  <div class="modal fade" id="asistente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="asistente_form">
          <div class="modal-header">
            <h5 class="modal-title">Procesar asistente</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <label class="form-label" for="asistente_inNombre">Nombre:</label>
            <input type="text" class="form-control mb-3" id="asistente_inNombre" required />
            <label class="form-label" for="asistente_inCedula">Cédula:</label>
            <input type="number" class="form-control mb-3" id="asistente_inCedula" min="1" step="1" required />
            <label class="form-label" for="asistente_inTipo">Tipo de pase:</label>
            <select class="form-select mb-3" id="asistente_inTipo">
              <option value="Visitante">Visitante</option>
              <option value="Cosplayer">Cosplayer concursante</option>
            </select>
            <div class="mb-3" id="asistente_grupoPreventa">
              <label class="form-label" for="asistente_inPreventa">Compró en preventa:</label>
              <select class="form-select" id="asistente_inPreventa">
                <option value="No">No</option>
                <option value="Si">Sí</option>
              </select>
            </div>
            <div class="form-check mb-3" id="asistente_grupoGrupal" hidden>
              <input class="form-check-input" type="checkbox" id="asistente_inGrupal" />
              <label class="form-check-label" for="asistente_inGrupal">Participa en pasarela grupal</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="asistente_btCancelar" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success" id="asistente_btAceptar">Aceptar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import CConvencion from "./dist/controllers/cConvencion.js";
    import CAsistente from "./dist/controllers/cAsistente.js";
    import VConvencionBootstrap from "./dist/views/vConvencionBootstrap.js";
    import VAsistenteBootstrap from "./dist/views/vAsistenteBootstrap.js";

    const vistaConvencion = new VConvencionBootstrap();
    const vistaAsistente = new VAsistenteBootstrap();
    const controladorAsistente = new CAsistente(vistaAsistente);
    new CConvencion(vistaConvencion, controladorAsistente);
  </script>
</body>
</html>
